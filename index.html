<!DOCTYPE html>
<!-- lang="id" memberi tahu browser bahwa halaman ini berbahasa Indonesia -->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Baris viewport ini wajib supaya tampilan responsif di HP -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk | LoginTest</title>

  <!-- File CSS (tampilan) akan kita buat setelah index.html selesai -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pembungkus seluruh halaman. Di desktop: panel kiri + form kanan -->
  <main class="login-page">

    <!-- PANEL KIRI: identitas aplikasi (di HP bisa dikecilkan lewat CSS) -->
    <section class="brand-panel">
      <p class="brand-name">E-Activity</p>
      <h1>Selamat datang kembali</h1>
      <p>Masuk untuk melanjutkan catatan aktivitas kamu.</p>
      <p class="brand-note">Melakukan aktivitas seharian kamu dengan E-Activity</p>
    </section>

    <!-- PANEL KANAN: form login -->
    <section class="form-panel">

      <!-- novalidate: matikan validasi bawaan browser, supaya pesan error
           kita sendiri (dari script.js) yang tampil dan bisa diuji -->
      <form id="login-form" class="login-form" novalidate>
        <h2>Masuk</h2>

        <!-- Pesan umum (misalnya: "Email atau password salah" atau
             "Akun terkunci sementara"). Awalnya kosong. -->
        <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>

        <!-- FIELD EMAIL -->
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nama@email.com"
            autocomplete="username"
            aria-describedby="email-error">
          <!-- Tempat pesan error khusus email (diisi oleh JavaScript) -->
          <span id="email-error" class="field-error"></span>
        </div>

        <!-- FIELD PASSWORD -->
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              aria-describedby="password-error">
            <!-- type="button" supaya tombol ini tidak ikut mengirim form -->
            <button
              type="button"
              id="toggle-password"
              class="toggle-password"
              aria-label="Tampilkan password">
              Lihat
            </button>
          </div>
          <span id="password-error" class="field-error"></span>
        </div>

        <!-- BARIS: Ingat saya + Lupa password -->
        <div class="options-row">
          <label class="remember">
            <input type="checkbox" id="remember" name="remember">
            Ingat saya
          </label>
          <a href="#" id="forgot-link">Lupa password?</a>
        </div>

        <!-- TOMBOL LOGIN: type="submit" supaya bisa ditekan dengan Enter -->
        <button type="submit" id="login-button" class="login-button">Login</button>

        <!-- LINK KE REGISTRASI (project kedua nanti) -->
        <p class="register-text">
          Belum punya akun? <a href="#" id="register-link">Daftar</a>
        </p>
      </form>

    </section>
  </main>

  <!-- File JavaScript (logika) dimuat paling bawah, setelah semua elemen
       di atas ada. Akan kita buat setelah style.css -->
  <script src="script.js"></script>
</body>
</html>
